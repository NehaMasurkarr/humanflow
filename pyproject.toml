[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "humanflow"
version = "0.1.0"
description = "Global and US migration analytics API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.156.4",
  "uvicorn[standard]==0.54.0",
]

[project.scripts]
humanflow-data = "pipelines.cli:main"

[project.optional-dependencies]
data = [
  "pandas==3.0.6",
  "openpyxl==3.1.5",
  "pycountry==26.2.16",
  "psycopg[binary]==3.3.6",
]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[tool.setuptools.packages.find]
include = ["backend*", "pipelines*", "analytics*"]

[tool.setuptools.package-data]
pipelines = ["sql/*.sql"]
analytics = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["postgres: requires a dedicated TEST_DATABASE_URL PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
